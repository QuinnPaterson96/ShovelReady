name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check app tests
      - run: uv run --locked pytest -q
        env:
          SHOVELREADY_ENV: test

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  container-startup:
    name: container-startup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t shovelready:ci .
      - name: Verify container serves health and frontend
        run: |
          docker run --rm -d --name shovelready-ci -p 127.0.0.1:18080:8000 shovelready:ci
          trap 'docker stop shovelready-ci' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/shovelready-health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("/tmp/shovelready-health.json")) == {"status": "ok"}'
          curl --fail --silent http://127.0.0.1:18080/ | grep -q ShovelReady

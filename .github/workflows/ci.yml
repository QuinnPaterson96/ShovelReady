name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: shovelready_test_00000000000000000000000000000000
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture -d shovelready_test_00000000000000000000000000000000"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run --locked ruff check app tests contract_tests migrations scripts
          docs/pilot-inputs/intake.py docs/pilot-inputs/test_intake.py
          docs/usability/check_fixtures.py
          docs/research/public-cases/verify_inventory.py
          docs/research/stannard-reference/verify_packet.py
      - run: uv run --locked python docs/pilot-inputs/test_acquire.py
      - run: uv run --locked python docs/pilot-inputs/test_intake.py
      - run: uv run --locked python docs/usability/check_fixtures.py
      - run: uv run --locked python docs/research/public-cases/verify_inventory.py
      - run: uv run --locked python docs/research/stannard-reference/verify_packet.py
      - run: uv run --locked pytest -q
        env:
          SHOVELREADY_ENV: test
          SHOVELREADY_TEST_DATABASE_DISPOSABLE: "yes"
          SHOVELREADY_TEST_DATABASE_URL: postgresql://fixture:disposable-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/shovelready_test_00000000000000000000000000000000

  native-local-database-windows:
    name: native-local-database-windows
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SHOVELREADY_ENV: test
      SHOVELREADY_LOCAL_LIFECYCLE_POSTGRES_BIN: C:\Program Files\PostgreSQL\17\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Verify explicit PostgreSQL 17 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('postgres', 'initdb', 'pg_ctl', 'pg_controldata')) {
            $binary = Join-Path $env:SHOVELREADY_LOCAL_LIFECYCLE_POSTGRES_BIN "$name.exe"
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Missing required PostgreSQL 17 binary: $name"
            }
            $version = & $binary --version
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '\(PostgreSQL\) 17\.') {
              throw "Required PostgreSQL 17 version check failed: $name"
            }
            Write-Output $version
          }
      - run: uv sync --locked
      - name: Verify owned scratch lifecycle and refusal checks (no skips)
        # No tracebacks/captured output: driver failures may include credentials or SQL data.
        shell: pwsh
        run: |
          # Runner image metadata points at its installed service; never use that cluster.
          Get-ChildItem Env:PG* | ForEach-Object {
            Write-Output "Clearing inherited PostgreSQL setting: $($_.Name)"
            Remove-Item -LiteralPath "Env:$($_.Name)"
          }
          $scratch = Join-Path $env:RUNNER_TEMP "native-lifecycle-$([guid]::NewGuid())"
          uv run --locked python -m pytest --basetemp "$scratch" -v tests/test_local_database.py -p tests.native_lifecycle_guard --tb=no --show-capture=no -rN
          exit $LASTEXITCODE

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  container-startup:
    name: container-startup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t shovelready:ci .
      - name: Verify container serves health, frontend and public-case metadata
        run: |
          docker run --rm -d --name shovelready-ci -p 127.0.0.1:18080:8000 shovelready:ci
          trap 'docker stop shovelready-ci' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/shovelready-health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("/tmp/shovelready-health.json")) == {"status": "ok"}'
          curl --fail --silent http://127.0.0.1:18080/ | grep -q ShovelReady
          curl --fail --silent http://127.0.0.1:18080/api/reference-cases > /tmp/shovelready-public-cases.json
          python3 - <<'PY'
          import json
          with open('/tmp/shovelready-public-cases.json') as source:
              data = json.load(source)
          assert data['schema_version'] == 'public-case-view.v1'
          assert data['identity']['kind'] == 'provisional_public_case_inventory'
          assert len(data['cases']) == 10
          assert data['first_case_id'] in {case['case_id'] for case in data['cases']}
          assert all(case['review_status'] == 'provisional' and case['benchmark_eligible'] is False for case in data['cases'])
          PY
